# The version of the distribution: it names the ZIP and every bundle.
vendor.version=7.4.0

# The folder of the delivery: lib/ holds the open-source jars, modules/ the vendor's own.
vendor.dir=acme-platform

# One bundle with every jar of the delivery.
vendor.category.platform=lib, modules

# Consumers compile against the vendor API and what its public methods expose; the rest is runtime only.
vendor.compilePackages=com.acme.platform

# The Spring jars carry no pom, and acme-core.jar carries nothing: name them by their file.
vendor.rule.1=^(spring-boot[a-z-]*)-(\d.*)\.jar$ -> org.springframework.boot open-source
vendor.rule.2=^(spring-[a-z-]+)-(\d.*)\.jar$ -> org.springframework open-source
vendor.rule.3=^(acme-[a-z-]+?)(?:-(\d[\w.]*))?\.jar$ -> com.acme.platform vendor-private

# Licence policy: no copyleft licences in the delivery. Jars that name no licence are listed by
# verifyVendorAgainstMaven from their published pom instead.
vendor.licenses.deny=GPL-*, AGPL-*
vendor.licenses.unknown=off
