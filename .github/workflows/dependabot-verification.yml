name: Dependabot verification metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  update:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout the Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Regenerate the checksums of new versions
        run: gradle/update-verification-metadata.sh

      - name: Commit, push and run CI on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "The verification metadata is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update dependency verification metadata" -- gradle/verification-metadata.xml
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
